<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysTechPro - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="login-view">
        <div class="login-side-img"></div>
        <div class="login-container">
            <img src="img/logo-fup.png" alt="Logo FUP" class="login-logo">
            <div class="login-title">SysTechPro</div>
            <div class="login-subtitle">Sistema de Gestión Tecnológica Profesional</div>
            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
                <button type="submit" class="login-btn">Ingresar</button>
                <p id="login-error" class="error"></p>
            </form>
            <div class="login-footer">
                © Fundación Universitaria de Popayán<br>
                Ana Tulande - Yefry Astaiza - Peter Fernandez
            </div>
        </div>
        <div class="login-side-img"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
